[project]
name = "mini-competition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wichmax", email = "wichmann.max@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
mini-competition = "mini_competition:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
